name: Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Build
        run: uv run pyinstaller ppap.spec

      - uses: actions/upload-artifact@v4
        with:
          name: ppap
          path: dist/*
