name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Build executable
        run: uv run pyinstaller ppap.spec

      - name: Create ZIP package
        shell: pwsh
        run: |
          $dir = "ppap-${{ github.ref_name }}"
          $files = @(
            "dist\ppap.exe",
            "LICENSE",
            "README.md"
          )
          Remove-Item -Path dist\$dir -Recurse -Force
          New-Item -Path dist\$dir -ItemType Directory | Out-Null
          $files | Copy-Item -Destination { Join-Path dist\$dir $_.Name }
          Compress-Archive `
            -Path dist\$dir `
            -DestinationPath "dist\ppap-${{ github.ref_name }}-windows-x64.zip"

      - name: Generate SHA256
        shell: pwsh
        run: |
          @(
            "dist/ppap.exe",
            "dist/ppap-${{ github.ref_name }}-windows-x64.zip"
          ) |
          ForEach-Object {
            $hash = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower()
            "$hash *$(Split-Path $_ -Leaf)"
          } |
          Set-Content "dist/SHA256SUMS.txt"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/ppap.exe
            dist/ppap-${{ github.ref_name }}-windows-x64.zip
            dist/SHA256SUMS.txt
